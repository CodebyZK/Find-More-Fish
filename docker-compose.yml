services:
  selfhostable-fishing-logbook:
    build: .
    container_name: selfhostable-fishing-logbook
    ports:
      # Publish the app on the host so trusted LAN DNS names can reach it.
      - "${APP_PORT:-80}:8080"
    volumes:
      # Keep the live database and uploaded media outside the Git checkout on
      # production. Local development still defaults to ./data.
      - ${FISH_DATA_DIR:-./data}:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # The production deploy sets this to true after HTTPS is enforced at
      # Nginx/Cloudflare. Leave development HTTP usable by default.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      GITLAB_REDIRECT_URI: ${GITLAB_REDIRECT_URI:-}
      GITLAB_ALLOWED_USER_IDS: ${GITLAB_ALLOWED_USER_IDS:-}
      FISH_STORAGE_BACKEND: ${FISH_STORAGE_BACKEND:-local}
      FISH_CLOUD_API_URL: ${FISH_CLOUD_API_URL:-}
      FISH_API_TOKEN: ${FISH_API_TOKEN:-}
      FISH_API_TOKEN_FILE: ${FISH_API_TOKEN_FILE:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
