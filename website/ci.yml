# Website checks and deployment are additive to the shared pipeline.
website_python_tests:
  stage: validate
  image: python:3.13-slim
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest website/tests -v

website_worker_tests:
  stage: validate
  image: node:22
  script:
    - cd cloud/worker
    - npm ci --no-audit --no-fund
    - npm test
    - CLOUDFLARE_D1_DATABASE_ID=00000000-0000-4000-8000-000000000000 npm run config:render
    - npx wrangler deploy --dry-run --config wrangler.generated.json --outdir /tmp/fish-worker-dry-run
  rules:
    - changes:
        - cloud/worker/**/*
        - .gitlab-ci.yml
        - website/ci.yml

website_compose_check:
  stage: docker_check
  image: docker:27
  script:
    - docker compose -f docker-compose.yml -f website/docker-compose.yml config --quiet

website_browser_tests:
  stage: smoke_test
  variables:
    PW_ARTIFACTS_DIR: "$CI_PROJECT_DIR/test-results/website-browser"
  image: python:3.13
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
  script:
    - python -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - npm ci --no-audit --no-fund
    - npm exec -- eslint --config website/eslint.config.mjs website
    - node website/build.mjs
    - node --test website/tests/*.test.mjs
    - npx playwright install --with-deps chromium
    - CI=1 npx playwright test --config website/playwright.config.cjs
  artifacts:
    when: on_failure
    paths:
      - test-results/website-browser/
    expire_in: 3 days

deploy_production:
  stage: .post
  image: alpine:3.20
  resource_group: fish-production
  needs:
    - job: test_python_app
    - job: test_javascript
    - job: build_frontend
    - job: browser_smoke_tests
    - job: website_python_tests
    - job: website_browser_tests
    - job: website_compose_check
    - job: docker_compose_config_check
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "Website"'
  environment:
    name: production
    url: https://fish.zionkoudijs.com
  before_script:
    - apk add --no-cache openssh-client python3
    - install -d -m 700 ~/.ssh
    - |
      : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY must be configured as a protected CI/CD variable}"
      if [ -f "$DEPLOY_SSH_KEY" ]; then
        cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
      else
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      fi
      chmod 600 ~/.ssh/id_ed25519
      if ! ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null 2>&1; then
        normalized_key=$(mktemp)
        {
          printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
          sed -e '1s/^DEPLOY_SSH_KEY=//' \
            -e '/^-----BEGIN OPENSSH PRIVATE KEY-----$/d' \
            -e '/^-----END OPENSSH PRIVATE KEY-----$/d' \
            ~/.ssh/id_ed25519 | tr -d '[:space:]'
          printf '\n%s\n' '-----END OPENSSH PRIVATE KEY-----'
        } > "$normalized_key"
        if ssh-keygen -lf "$normalized_key" >/dev/null 2>&1; then
          mv "$normalized_key" ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        else
          rm -f "$normalized_key"
          echo 'DEPLOY_SSH_KEY is not a valid OpenSSH private key' >&2
          exit 1
        fi
      fi
      ssh-keygen -lf ~/.ssh/id_ed25519
    - |
      : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS must be configured as a protected CI/CD variable}"
      if [ -f "$DEPLOY_KNOWN_HOSTS" ]; then
        cp "$DEPLOY_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
      chmod 644 ~/.ssh/known_hosts
      test -s ~/.ssh/known_hosts
      wc -l ~/.ssh/known_hosts
  script:
    - |
      : "${DEPLOY_HOST:?DEPLOY_HOST must be configured}"
      : "${DEPLOY_USER:?DEPLOY_USER must be configured}"
      : "${DEPLOY_PATH:?DEPLOY_PATH must be configured}"
      : "${DEPLOY_DATA_PATH:?DEPLOY_DATA_PATH must be configured}"
      # Public URLs come from this GitLab instance and the production website.
      # Project variables can still override either value.
      export GITLAB_URL="${GITLAB_URL:-${CI_SERVER_URL:?Set GITLAB_URL or provide CI_SERVER_URL}}"
      export GITLAB_REDIRECT_URI="${GITLAB_REDIRECT_URI:-https://fish.zionkoudijs.com/auth/gitlab/callback}"
      umask 077
      oauth_env=$(mktemp)
      trap 'rm -f "$oauth_env"' EXIT
      python3 - "$oauth_env" <<'PY'
      import os
      import sys

      required = ("GITLAB_URL", "GITLAB_CLIENT_ID", "GITLAB_CLIENT_SECRET", "GITLAB_REDIRECT_URI")
      missing = [key for key in required if not os.environ.get(key, "").strip()]
      if missing:
          raise SystemExit(
              "Missing production OAuth variables: " + ", ".join(missing)
              + ". Configure them in GitLab Settings > CI/CD > Variables with production scope; "
              "protected variables require the Website branch to be protected."
          )
      values = {key: os.environ[key] for key in required}
      if os.environ.get("GITLAB_ALLOWED_USER_IDS"):
          values["GITLAB_ALLOWED_USER_IDS"] = os.environ["GITLAB_ALLOWED_USER_IDS"]
      for key, value in values.items():
          if any(char in value for char in "\r\n\0"):
              raise SystemExit(f"{key} contains unsupported control characters")
      def quote(value):
          return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"
      with open(sys.argv[1], "w", encoding="utf-8") as stream:
          for key, value in values.items():
              stream.write(f"{key}={quote(value)}\n")
      PY
      chmod 600 "$oauth_env"
      scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
        "$oauth_env" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.oauth.env.$CI_COMMIT_SHA"
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
        "$DEPLOY_USER@$DEPLOY_HOST" /bin/sh -s -- \
        "$DEPLOY_PATH" "$DEPLOY_DATA_PATH" "$CI_COMMIT_SHA" <<'REMOTE_SCRIPT'
      set -eu
      DEPLOY_PATH=$1
      DEPLOY_DATA_PATH=$2
      CI_COMMIT_SHA=$3
      OAUTH_ENV_STAGING="$DEPLOY_PATH/.oauth.env.$CI_COMMIT_SHA"
      trap 'rm -f "$OAUTH_ENV_STAGING"' EXIT
      cd "$DEPLOY_PATH"
      git fetch --prune origin Website
      git cat-file -e "$CI_COMMIT_SHA^{commit}"
      git reset --hard "$CI_COMMIT_SHA"
      mv "$OAUTH_ENV_STAGING" "$DEPLOY_PATH/.oauth.env"
      chmod 600 "$DEPLOY_PATH/.oauth.env"
      mkdir -p "$DEPLOY_DATA_PATH/uploads"
      export APP_PORT=8081 FISH_DATA_DIR="$DEPLOY_DATA_PATH" SESSION_COOKIE_SECURE=true FISH_STORAGE_BACKEND=local FISH_OAUTH_ENV_FILE="$DEPLOY_PATH/.oauth.env" COMPOSE_PROJECT_NAME=fish-logbook
      docker compose -f docker-compose.yml -f website/docker-compose.yml build
      if docker compose -f docker-compose.yml -f website/docker-compose.yml up -d --remove-orphans --wait --wait-timeout 180; then
        docker compose -f docker-compose.yml -f website/docker-compose.yml ps
      else
        deploy_status=$?
        echo 'Production startup failed; collecting container and health-check diagnostics.' >&2
        docker compose -f docker-compose.yml -f website/docker-compose.yml ps --all || true
        docker compose -f docker-compose.yml -f website/docker-compose.yml logs --no-color --tail 200 || true
        for container_id in $(docker compose -f docker-compose.yml -f website/docker-compose.yml ps --all --quiet); do
          docker inspect --format '{{json .State}}' "$container_id" || true
        done
        exit "$deploy_status"
      fi
      REMOTE_SCRIPT

# Reuse the existing production SSH connection for read-only proxy diagnostics.
# This job is optional and never counts as a production deployment.
website_proxy_inspection:
  extends: deploy_production
  needs: []
  environment:
    name: production
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "Website"'
      when: manual
      allow_failure: true
  script:
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" /bin/sh -s < website/scripts/inspect-proxy.sh

deploy_cloudflare_worker:
  stage: .post
  image: node:22-alpine
  resource_group: fish-cloudflare-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "Website"'
      changes:
        - cloud/worker/**/*
        - .gitlab-ci.yml
        - website/ci.yml
  environment:
    name: production
  before_script:
    - cd cloud/worker
    - npm ci
    - |
      : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured as a protected production variable}"
      : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured as a protected production variable}"
      : "${CLOUDFLARE_D1_DATABASE_ID:?CLOUDFLARE_D1_DATABASE_ID must be configured as a protected production variable}"
  script:
    - npm run config:render
    - npm run migrate:remote
    - npm run deploy
